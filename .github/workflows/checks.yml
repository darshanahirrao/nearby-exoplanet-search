name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt -r requirements-experiments.txt
      - run: python -m ruff check scripts tests
      - run: python -m ruff format --check scripts tests
      - run: python -m unittest discover -s tests -v
